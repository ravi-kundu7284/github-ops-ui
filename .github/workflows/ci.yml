# GitHub Actions Continuous Integration & Continuous Deployment (CI/CD) Workflow
# Repository: github-ops-ui
#
# Triggers:
# 1. On every push to the `main` branch.
# 2. On pull requests targeting `main`.
#
# Pipeline stages:
# - Stage 1 (test-and-build): Installs dependencies with npm ci, runs TypeScript typecheck,
#   executes Vitest test suite, and compiles the production bundle with Vite.
# - Stage 2 (docker-build): Builds the multi-stage NGINX container image on merge to main.

name: Frontend CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Test, Lint & Production Build
  # -------------------------------------------------------------------------
  test-and-build:
    name: Lint, Test & Build UI
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Configure Node.js 18 runtime with npm cache
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Step 3: Clean install of pinned dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Step 4: Strict TypeScript compiler checks (tsc --noEmit)
      - name: TypeScript typecheck
        run: npm run lint

      # Step 5: Execute Vitest unit test suite (DOM testing with JSDOM)
      - name: Run unit tests (Vitest)
        run: npm run test

      # Step 6: Compile production assets into dist/ directory via Vite
      - name: Build production bundle
        run: npm run build

  # -------------------------------------------------------------------------
  # Job 2: Container Image Build Verification
  # -------------------------------------------------------------------------
  docker-build:
    name: Build & Verify Docker Image
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build multi-stage NGINX container to verify production containerization
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: github-ops-ui:latest
